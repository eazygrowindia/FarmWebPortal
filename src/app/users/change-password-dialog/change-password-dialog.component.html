<div class="change-password-modal">
  <!-- Modal Header -->
  <div class="modal-header">
    <div class="modal-header-icon">
      <mat-icon>lock_reset</mat-icon>
    </div>
    <div class="modal-header-text">
      <h2 class="modal-title">Change Password</h2>
      <p class="modal-subtitle">Update password for <strong>{{ user.name }}</strong></p>
    </div>
    <button mat-icon-button class="modal-close-btn" (click)="onCancel()" title="Close">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Error Alert Banner -->
  <div class="error-banner" *ngIf="errorMessage()">
    <mat-icon class="error-icon">error_outline</mat-icon>
    <span class="error-text">{{ errorMessage() }}</span>
  </div>

  <!-- Form Body -->
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="password-form">
    <!-- Old Password -->
    <div class="field-container">
      <label class="field-label">Current Password</label>
      <mat-form-field appearance="outline" class="dark-form-field">
        <input matInput
          [type]="hideOldPassword() ? 'password' : 'text'"
          formControlName="oldPassword"
          placeholder="Enter current password"
          autocomplete="current-password" />
        <button mat-icon-button matSuffix type="button" (click)="toggleOldPasswordVisibility()" [attr.aria-label]="'Hide password'" class="visibility-btn">
          <mat-icon>{{ hideOldPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error *ngIf="form.get('oldPassword')?.hasError('required') && form.get('oldPassword')?.touched">
          Current password is required
        </mat-error>
        <mat-error *ngIf="form.get('oldPassword')?.hasError('incorrect') && form.get('oldPassword')?.touched">
          Current password is incorrect
        </mat-error>
      </mat-form-field>
    </div>

    <!-- New Password -->
    <div class="field-container">
      <label class="field-label">New Password</label>
      <mat-form-field appearance="outline" class="dark-form-field">
        <input matInput
          [type]="hideNewPassword() ? 'password' : 'text'"
          formControlName="newPassword"
          placeholder="Enter new password (min. 8 characters)"
          autocomplete="new-password" />
        <button mat-icon-button matSuffix type="button" (click)="toggleNewPasswordVisibility()" [attr.aria-label]="'Hide password'" class="visibility-btn">
          <mat-icon>{{ hideNewPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error *ngIf="form.get('newPassword')?.hasError('required') && form.get('newPassword')?.touched">
          New password is required
        </mat-error>
        <mat-error *ngIf="form.get('newPassword')?.hasError('minlength') && form.get('newPassword')?.touched">
          New password must be at least 8 characters
        </mat-error>
      </mat-form-field>
    </div>

    <!-- Confirm New Password (twice) -->
    <div class="field-container">
      <label class="field-label">Confirm New Password</label>
      <mat-form-field appearance="outline" class="dark-form-field">
        <input matInput
          [type]="hideConfirmPassword() ? 'password' : 'text'"
          formControlName="confirmPassword"
          placeholder="Re-enter new password"
          autocomplete="new-password" />
        <button mat-icon-button matSuffix type="button" (click)="toggleConfirmPasswordVisibility()" [attr.aria-label]="'Hide password'" class="visibility-btn">
          <mat-icon>{{ hideConfirmPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error *ngIf="form.get('confirmPassword')?.hasError('required') && form.get('confirmPassword')?.touched">
          Please confirm your new password
        </mat-error>
        <mat-error *ngIf="form.get('confirmPassword')?.hasError('mismatch') && form.get('confirmPassword')?.touched">
          Passwords do not match
        </mat-error>
      </mat-form-field>
    </div>

    <!-- Dialog Actions -->
    <div class="modal-actions">
      <button mat-stroked-button type="button" class="btn-cancel" (click)="onCancel()" [disabled]="isSubmitting()">
        Cancel
      </button>

      <button mat-flat-button type="submit" class="btn-submit" [disabled]="form.invalid || isSubmitting()">
        <mat-progress-spinner diameter="18" mode="indeterminate" *ngIf="isSubmitting()"></mat-progress-spinner>
        <mat-icon *ngIf="!isSubmitting()">check</mat-icon>
        <span>{{ isSubmitting() ? 'Verifying & Updating...' : 'Update Password' }}</span>
      </button>
    </div>
  </form>
</div>
